name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  go:
    name: Go (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    env:
      CGO_ENABLED: '0'
    steps:
      - name: Preserve repository line endings
        run: git config --global core.autocrlf false
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Check formatting
        run: test -z "$(git ls-files -z '*.go' | xargs -0 gofmt -l)"
      - name: Vet
        run: go vet ./...
      - name: Test (macOS, race)
        if: runner.os == 'macOS'
        env:
          CGO_ENABLED: '1'
        run: go test -race -count=1 -timeout=10m -p=2 -parallel=2 ./...
      - name: Test (Windows)
        if: runner.os == 'Windows'
        run: go test -count=1 -timeout=10m -p=2 -parallel=2 ./...
      - name: MyGo vet
        if: runner.os == 'macOS'
        run: go tool mygo vet .
      - name: Build desktop (macOS)
        if: runner.os == 'macOS'
        run: go build -o "$RUNNER_TEMP/curlgo-desktop" .
      - name: Build desktop (Windows amd64 and arm64)
        if: runner.os == 'Windows'
        run: |
          for arch in amd64 arm64; do
            GOARCH="$arch" go build -o "$RUNNER_TEMP/curlgo-desktop-$arch.exe" .
          done

  cli:
    name: Independent CLI (Linux)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CGO_ENABLED: '0'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Vet CLI and core
        run: go vet ./cmd/curlgo ./internal/...
      - name: Test CLI and core
        run: go test -count=1 -timeout=10m -p=2 -parallel=2 ./cmd/curlgo ./internal/...
      - name: Build independent CLI
        run: go build -o "$RUNNER_TEMP/curlgo-cli" ./cmd/curlgo
      - name: Test local API scenarios
        run: python3 scripts/test_api_skill.py --binary "$RUNNER_TEMP/curlgo-cli"
